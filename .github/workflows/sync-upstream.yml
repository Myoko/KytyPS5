name: Sync with upstream

# ============================================================================
# 方案 B：控制分支 + 纯镜像 main
#
# 分支分工：
#   ci   ← 控制分支（本文件所在的默认分支）：只放这个 workflow，永远不参与镜像
#   main ← 纯镜像分支：每隔一周被强制对齐到上游 KytyPS5/KytyPS5 的 main，零差异
#
# 为什么默认分支必须是 ci：
#   GitHub 的 schedule 定时任务只会在「默认分支」上存在的 workflow 里触发。
#   把本文件放在 ci 并把 ci 设为默认分支，main 的强推就永远不会覆盖到它，
#   所以定时任务可以长期存活，不需要人工维护。
#   上游没有 ci 这个分支，ci 也不会被推送/覆盖。
# ============================================================================
#
# 定时：cron 中每 14 天 = 每月 1 号和 15 号 03:23 UTC（北京时间 11:23）
# 想改频率只改 cron 的日期字段，例如：
#   '23 3 * * 0'    每周日    '23 3 1 * *'    每月 1 号    '23 3 * * 1'  每周一
# 注意 cron 用 UTC，北京时间 = UTC + 8。定时任务可能有几分钟~十几分钟延迟，属正常。
#
# 首次使用前一次性设置（之后不用再管）：
#   1. 把 ci 推上去：            git push -u origin ci
#   2. 把默认分支改成 ci：       gh repo edit Myoko/KytyPS5 --default-branch ci
#      （网页操作：Settings → General → Default branch → 切换到 ci）
#   3. 手动跑一次验证：          Actions → Sync with upstream → Run workflow
# ============================================================================

on:
  schedule:
    - cron: '23 3 */14 * *'
  # 也可以在 Actions 页面点 “Run workflow” 手动同步一次
  workflow_dispatch:

# 只做同步，不需要别的权限；contents: write 用于强推 main 和同步标签
permissions:
  contents: write

# 同一时间只跑一个同步任务，避免两个任务互相推挤
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 注意：checkout 落在 ${{ github.workspace }}，正好是 $GITHUB_WORKSPACE，
      # 也就是 git 命令的默认工作目录，所以下面不需要 cd。
      # 本任务全程操作 main，不依赖当前检出的分支（ci），因此检出 ci 没有任何影响。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 只为了拿到 .git 目录和带写权限的凭据，历史后面再完整拉取
          fetch-depth: 0
          persist-credentials: true

      - name: Show current state
        run: |
          set -euo pipefail
          MY=$(git ls-remote https://github.com/${GITHUB_REPOSITORY} refs/heads/main | cut -f1)
          UP=$(git ls-remote https://github.com/KytyPS5/KytyPS5 refs/heads/main | cut -f1)
          echo "我的 main (origin)  : ${MY:0:7}"
          echo "上游 main (upstream): ${UP:0:7}"
          if [ -n "$MY" ] && [ "$MY" = "$UP" ]; then
            echo "SYNCED=true" >> "$GITHUB_ENV"
          else
            echo "SYNCED=false" >> "$GITHUB_ENV"
          fi

      - name: Pull upstream and mirror main
        if: env.SYNCED == 'false'
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/KytyPS5/KytyPS5
          # 拉取上游全部提交和全部标签
          git fetch --prune --tags upstream '+refs/heads/*:refs/remotes/upstream/*'
          # 强制对齐：本地 main 变成和上游 main 完全一样
          git reset --hard upstream/main
          # 如果配了个人访问令牌（PAT，见下方说明），优先用它推送
          if [ -n "${SYNC_PAT:-}" ]; then
            git remote set-url origin "https://x-access-token:${SYNC_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          # --force 用于覆盖上游可能发生的回退/变基；--tags 同步上游全部标签
          # 注意：这里只推 main，绝不动 ci（控制分支），所以本 workflow 不会被自己删掉
          git push origin HEAD:main --force --tags
        env:
          # 可选：仓库 Settings → Secrets and variables → Actions 里加一个叫 SYNC_PAT 的 secret
          # （细粒度 PAT，权限只需 Contents: Read and write）。不加也能正常同步，用 GITHUB_TOKEN 兜底。
          SYNC_PAT: ${{ secrets.SYNC_PAT }}

      - name: Delete tags removed upstream
        if: env.SYNCED == 'false'
        run: |
          set -euo pipefail
          # 上游删掉的标签，本仓库也删掉，保证标签与上游完全一致
          git ls-remote --tags https://github.com/KytyPS5/KytyPS5 \
            | grep -v '\^{}' \
            | sed 's#.*refs/tags/##' \
            | sort > /tmp/upstream_tags.txt
          git tag | sort > /tmp/local_tags.txt
          comm -13 /tmp/upstream_tags.txt /tmp/local_tags.txt > /tmp/stale_tags.txt
          if [ -s /tmp/stale_tags.txt ]; then
            echo "删除上游已不存在的标签："
            cat /tmp/stale_tags.txt
            xargs -r git push origin --delete < /tmp/stale_tags.txt
          else
            echo "没有多余标签。"
          fi

      - name: Summary
        run: |
          {
            echo "### 上游同步结果"
            echo ""
            if [ "$SYNCED" = "true" ]; then
              echo "- 无需同步：main 已等于上游最新提交。"
            else
              echo "- 已把 main 强推到上游最新：\`$(git rev-parse --short upstream/main)\`"
            fi
            echo "- 控制分支 \`ci\`（本 workflow 所在分支）未受影响，不会被镜像覆盖。"
          } >> "$GITHUB_STEP_SUMMARY"
